version: '3.8'

# Docker Compose для Neo4j граф бази даних
# Використання: docker-compose -f docker-compose.neo4j.yml up -d

services:
  neo4j:
    image: neo4j:latest
    container_name: telegram-bot-neo4j
    ports:
      - "7474:7474"  # HTTP - Neo4j Browser
      - "7687:7687"  # Bolt - для підключення з Python
    environment:
      # Автентифікація: username/password
      - NEO4J_AUTH=neo4j/password
      
      # Плагіни (APOC для додаткових функцій)
      - NEO4J_PLUGINS=["apoc"]
      
      # Налаштування пам'яті (налаштуйте під ваші потреби)
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      
      # Дозволити підключення з будь-якого IP (для локальної розробки)
      - NEO4J_dbms_connectors_default__listen__address=0.0.0.0
      
      # Дозволити Bolt з будь-якого IP
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      
      # Дозволити HTTP з будь-якого IP
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    volumes:
      # Збереження даних
      - neo4j_data:/data
      
      # Логи
      - neo4j_logs:/logs
      
      # Імпорт файлів
      - neo4j_import:/var/lib/neo4j/import
      
      # Плагіни
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
    driver: local
    name: telegram_bot_neo4j_data
  neo4j_logs:
    driver: local
    name: telegram_bot_neo4j_logs
  neo4j_import:
    driver: local
    name: telegram_bot_neo4j_import
  neo4j_plugins:
    driver: local
    name: telegram_bot_neo4j_plugins
