---
- name: Start Neo4j with Docker Compose
  hosts: localhost
  connection: local
  become: no
  vars:
    # Default Neo4j password used for local dev containers only.
    # For real environments, override via: ansible-playbook ansible/playbook.yml -e "neo4j_auth=your_password"
    neo4j_auth: "changeme"
    
  tasks:
    - name: Check if Docker is installed
      command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Check if Docker Desktop is installed (macOS)
      stat:
        path: "/Applications/Docker.app"
      register: docker_desktop_installed
      when: ansible_facts['os_family'] == "Darwin"
    
    - name: Fail if Docker is not installed
      fail:
        msg: |
          Docker is not installed!
          
          Встановіть Docker Desktop:
          ansible-playbook ansible/install-docker-desktop.yml
          
          Або вручну:
          brew install --cask docker
          open -a Docker
      when: docker_check.rc != 0 and (not docker_desktop_installed.stat.exists | default(false))

    - name: Check if docker compose plugin is available
      command: docker compose version
      register: docker_compose_plugin_check
      changed_when: false
      failed_when: false
      when: docker_check.rc == 0
    
    - name: Check if docker-compose standalone is available
      command: docker-compose --version
      register: docker_compose_standalone_check
      changed_when: false
      failed_when: false
    
    - name: Warn if docker-compose not available
      debug:
        msg: |
          ⚠️  docker-compose не знайдено!
          
          Встановіть через:
          ansible-playbook ansible/install-docker-compose.yml
          
          Або використайте docker compose plugin (якщо є Docker Desktop)
      when: docker_compose_plugin_check.rc != 0 and docker_compose_standalone_check.rc != 0

    - name: Check if Docker is running
      command: docker ps
      register: docker_running
      changed_when: false
      failed_when: false

    - name: Try to start Docker Desktop (macOS)
      shell: open -a Docker
      when: 
        - ansible_facts['os_family'] == "Darwin"
        - docker_running.rc != 0
        - docker_desktop_installed.stat.exists | default(false)
      ignore_errors: yes

    - name: Wait for Docker to be ready
      wait_for:
        port: 2375
        host: localhost
        delay: 10
        timeout: 120
      when: docker_running.rc != 0
      ignore_errors: yes

    - name: Fail if Docker is not running
      fail:
        msg: |
          Docker is not running!
          
          Запустіть Docker Desktop вручну:
          open -a Docker
          
          Дочекайтеся поки Docker запуститься (30-60 секунд)
      when: docker_running.rc != 0

    - name: Create docker-compose.neo4j.yml if it doesn't exist
      copy:
        content: |
          version: '3.8'
          
          services:
            neo4j:
              image: neo4j:latest
              container_name: telegram-bot-neo4j
              ports:
                - "7474:7474"
                - "7687:7687"
              environment:
                - NEO4J_AUTH=neo4j/{{ neo4j_auth }}
                - NEO4J_PLUGINS=["apoc"]
                - NEO4J_dbms_memory_heap_initial__size=512m
                - NEO4J_dbms_memory_heap_max__size=2G
                - NEO4J_dbms_memory_pagecache_size=1G
                - NEO4J_dbms_connectors_default__listen__address=0.0.0.0
                - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
                - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
              volumes:
                - neo4j_data:/data
                - neo4j_logs:/logs
                - neo4j_import:/var/lib/neo4j/import
                - neo4j_plugins:/plugins
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "{{ neo4j_auth }}", "RETURN 1"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 30s
          
          volumes:
            neo4j_data:
              driver: local
            neo4j_logs:
              driver: local
            neo4j_import:
              driver: local
            neo4j_plugins:
              driver: local
        dest: "{{ playbook_dir }}/../docker/neo4j/docker-compose.neo4j.yml"
        mode: '0644'
      when: not (lookup('file', '../docker/neo4j/docker-compose.neo4j.yml') | default('', true) | length > 0)

    - name: Stop existing Neo4j container if exists
      docker_container:
        name: telegram-bot-neo4j
        state: absent
      ignore_errors: yes

    - name: Start Neo4j with Docker Compose
      shell: |
        cd {{ playbook_dir }}/..
        if command -v docker-compose &> /dev/null; then
          docker-compose -f docker/neo4j/docker-compose.neo4j.yml up -d
        elif docker compose version &> /dev/null; then
          docker compose -f docker/neo4j/docker-compose.neo4j.yml up -d
        else
          ~/.local/bin/docker-compose -f docker/neo4j/docker-compose.neo4j.yml up -d
        fi
      register: compose_result
      changed_when: "'Creating' in compose_result.stdout or 'Starting' in compose_result.stdout"

    - name: Wait for Neo4j to be ready
      wait_for:
        port: 7687
        host: localhost
        delay: 10
        timeout: 120

    - name: Check Neo4j status
      shell: |
        if command -v docker-compose &> /dev/null; then
          docker-compose -f docker/neo4j/docker-compose.neo4j.yml ps
        elif docker compose version &> /dev/null; then
          docker compose -f docker/neo4j/docker-compose.neo4j.yml ps
        else
          ~/.local/bin/docker-compose -f docker/neo4j/docker-compose.neo4j.yml ps
        fi
      register: neo4j_status
      changed_when: false

    - name: Display Neo4j status
      debug:
        msg: |
          Neo4j has been installed and started!
          
          Access Neo4j Browser at: http://localhost:7474
          Username: neo4j
          Password: {{ neo4j_auth }}
          
          Bolt connection: bolt://localhost:7687
          
          Status:
          {{ neo4j_status.stdout }}
